<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tajs Games Official</title>
    <link rel="icon" type="image/png" sizes="512x512" href="swfservertajsgamesofficial.png">
    <link rel="apple-touch-icon" sizes="512x512" href="swfservertajsgamesofficial.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        if (sessionStorage.getItem("tajs_auth_ok") === "true") {
            sessionStorage.removeItem("tajs_auth_ok");
            const a = document.createElement("a");
            a.href = "juego.swf";
            a.download = "juego.swf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        } else {
            sessionStorage.setItem("tajs_block_reason", "Intento de acceso directo sin contraseña a downloadswf.html");
            window.location.href = "vpnoretcblock.html";
        }
    </script>
</body>
</html>
